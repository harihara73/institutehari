<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h2>Admin Login</h2>
            </div>
            <nav>
                <a href="/">Back to Search</a>
            </nav>
        </header>

        <main class="main-content">
            <div class="card glass-card">
                <h1>Secure Access</h1>
                <p class="subtitle">Please enter your admin credentials to continue.</p>

                <form id="loginForm" method="POST">
                    <script>
                        // Inject API URL into form action
                        document.addEventListener('DOMContentLoaded', () => {
                            const API_URL = 'https://institutehari.onrender.com'; // This should be updated by the user
                            document.getElementById('loginForm').action = `${API_URL}/login`;
                        });
                    </script>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="primary-btn">Login</button>

                    <div id="loginError" class="result-message error" style="display: none; margin-top: 15px;">
                        Invalid credentials. Please try again.
                    </div>
                </form>
            </div>
        </main>

        <div class="decoration circle-1"></div>
        <div class="decoration circle-2"></div>
    </div>
    <script>
        // Show error if URL has ?error=1
        if (window.location.search.includes('error=1')) {
            document.getElementById('loginError').style.display = 'block';
        }
    </script>
</body>

</html>
